{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:0 auto;">
  <h1>Change password</h1>
  {% if forced %}
  <p>You must set a new password before continuing.</p>
  {% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password</label>
    <input name="current_password" type="password" required autofocus autocomplete="current-password">
    <label>New password</label>
    <input name="new_password" type="password" required minlength="{{ min_password_length }}"
           autocomplete="new-password">
    <label>Confirm new password</label>
    <input name="confirm_password" type="password" required minlength="{{ min_password_length }}"
           autocomplete="new-password">
    <p style="margin-top:16px">
      <button class="btn btn-green" type="submit">Save</button>
      {% if not forced %}
      <a class="btn" href="{{ url_for('dashboard') }}">Cancel</a>
      {% endif %}
    </p>
  </form>
</div>
{% endblock %}
